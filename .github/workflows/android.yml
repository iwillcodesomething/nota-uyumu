name: Test ve APK

on:
  push:
    branches: [main, v2-sifirdan]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Çekirdek testleri
        run: ./gradlew --no-daemon :core:test

      - name: Debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: İmzalı release APK (gizli anahtarlar tanımlıysa)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          NU_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          NU_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          NU_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::KEYSTORE_BASE64 tanımlı değil; yalnızca debug APK üretildi."
            echo "SIGNED=0" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          export NU_KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
          ./gradlew --no-daemon :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk NotaUyumu.apk
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)/apksigner verify NotaUyumu.apk
          echo "SIGNED=1" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: NotaUyumu-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            NotaUyumu.apk
          if-no-files-found: warn

      - name: GitHub sürümü
        if: env.SIGNED == '1' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: Nota Uyumu 2.0.${{ github.run_number }}
          files: NotaUyumu.apk
          generate_release_notes: true
