name: Test ve APK

on:
  push:
    branches: [main, pdf-okuma]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  HOMR_URL: https://github.com/liebharc/homr/releases/download/onnx_checkpoints
  HOMR_ENCODER: encoder_pytorch_model_566-ccd1cb311c368b5711dd238d2464c615397a3f2b
  HOMR_DECODER: decoder_pytorch_model_566-ccd1cb311c368b5711dd238d2464c615397a3f2b

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: homr modellerini önbellekten al
        id: homr-cache
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/homr/*.onnx
          key: homr-566-ccd1cb31

      - name: homr modellerini indir ve doğrula (AGPL-3.0, github.com/liebharc/homr)
        if: steps.homr-cache.outputs.cache-hit != 'true'
        run: ./scripts/homr_modelleri.sh

      - name: Koro test görsellerini üret (Verovio)
        run: |
          pip install --quiet verovio cairosvg
          python scripts/koro_gorselleri.py "$RUNNER_TEMP/koro"
          echo "OMR_CHOIR_DIR=$RUNNER_TEMP/koro" >> "$GITHUB_ENV"

      - name: Çekirdek testleri
        run: ./gradlew --no-daemon :core:test

      - name: Debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: İmzalı release APK (gizli anahtarlar tanımlıysa)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          NU_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          NU_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          NU_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::KEYSTORE_BASE64 tanımlı değil; yalnızca debug APK üretildi."
            echo "SIGNED=0" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          export NU_KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
          ./gradlew --no-daemon :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk NotaUyumu.apk
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)/apksigner verify NotaUyumu.apk
          echo "SIGNED=1" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        continue-on-error: true  # hesap artifact kotası dolabiliyor; asıl teslim GitHub sürümüdür
        with:
          name: NotaUyumu-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            NotaUyumu.apk
          if-no-files-found: warn

      - name: GitHub sürümü (main)
        if: env.SIGNED == '1' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.2.${{ github.run_number }}
          name: Nota Uyumu 2.2.${{ github.run_number }}
          files: NotaUyumu.apk
          generate_release_notes: true

      - name: Ön sürüm (deneme dalı)
        if: env.SIGNED == '1' && github.ref == 'refs/heads/pdf-okuma'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.2.0-deneme.${{ github.run_number }}
          name: Nota Uyumu 2.2 · deneme ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: NotaUyumu.apk
          body: "pdf-okuma dalından imzalı deneme sürümü: PDF ve fotoğraftan nota okuma."
