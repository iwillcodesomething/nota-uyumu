name: Cihaz testi (emülatör)

on:
  push:
    branches: [pdf-okuma]
  workflow_dispatch:

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      HOMR_URL: https://github.com/liebharc/homr/releases/download/onnx_checkpoints
      HOMR_ENCODER: encoder_pytorch_model_566-ccd1cb311c368b5711dd238d2464c615397a3f2b
      HOMR_DECODER: decoder_pytorch_model_566-ccd1cb311c368b5711dd238d2464c615397a3f2b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }
      - uses: gradle/actions/setup-gradle@v4
      - name: homr modellerini önbellekten al
        id: homr-cache
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/homr/*.onnx
          key: homr-566-ccd1cb31
      - name: homr modellerini indir
        if: steps.homr-cache.outputs.cache-hit != 'true'
        run: ./scripts/homr_modelleri.sh
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: APK'ları derle
        run: ./gradlew --no-daemon -Pemulator :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease
      - name: Emülatörde uçtan uca testler
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          disk-size: 6G
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb logcat -c
            ./gradlew --no-daemon -Pemulator :app:connectedDebugAndroidTest || echo "TESTLER BASARISIZ" > /tmp/fail
            adb logcat -d -s NU_TEST:I AndroidRuntime:E TestRunner:* | grep -v "^-" | tail -n 300
            adb install -r app/build/outputs/apk/release/app-release.apk && adb logcat -c && adb shell am start -W -n com.notauyumu.studio/.MainActivity && sleep 8 && (adb shell pidof com.notauyumu.studio && echo "RELEASE ACILIS TAMAM" || (echo "RELEASE COKTU" > /tmp/fail)); adb logcat -d -s AndroidRuntime:E | tail -n 60
            test ! -f /tmp/fail
